name: nextflow-validate
# Verify Nextflow ACCEPTS every pipeline without running the analysis. For each
# pipeline this runs `nextflow run <upstream> -profile test,docker -preview`,
# which compiles the pipeline, resolves config + the test profile, runs the
# nf-schema parameter validation and builds the full task DAG — then stops
# before launching any task. It confirms each pinned pipeline is runnable up to
# the moment of execution; the analysis itself is covered by nf-core's own
# per-release CI. Submodules are initialised one at a time and cleaned up, so
# disk stays bounded as the library grows.
on:
  schedule:
    - cron: "0 5 * * *"      # nightly, 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.tsv"
      - ".gitmodules"
      - "pipelines/*/skill.md"
      - "pipelines/*/upstream"
      - "scripts/nextflow_accept.sh"
      - ".github/workflows/nextflow-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NXF_ANSI_LOG: "false"
    steps:
      # No upfront submodules: each pipeline is initialised on demand below.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        run: |
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output nextflow \
            https://raw.githubusercontent.com/nextflow-io/nextflow/701c82c1035b5813d0cbcfe60fb83d209743934c/nextflow
          echo "968af86ff461c8c78a0704d46a0f0af0be52adf1dd15298b16f50a5463385456  nextflow" \
            | sha256sum --check --strict
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
      - name: Preview every pipeline through Nextflow (no task execution)
        run: bash scripts/nextflow_accept.sh
